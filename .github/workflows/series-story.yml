name: series-story

on:
  schedule:
    # 毎日 12:00 JST(= 03:00 UTC)。GitHubの定時実行は数時間遅れることがある
    # 投稿するのは 2026-11-11 〜 2026-11-27 の17日間だけ(期間外は何もしない)
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # 手動でも実行できる。期間内なら本当に投稿される
  push:
    paths:
      - "trigger/series.txt"   # このファイルを更新(push)すると即実行される

# 同時に2つ動かさない
concurrency:
  group: series-story

permissions:
  contents: write   # 「投稿済み」の目印(posted/)を保存するため

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python post_series_story.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/elizabethice/story-images/main
      - name: 投稿済みの目印を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted
          if ! git diff --cached --quiet; then
            git commit -m "Mark series story as posted"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
